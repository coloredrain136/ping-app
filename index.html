<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ping</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ping" />
  <meta name="theme-color" content="#0f0f10" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f10;
      --surface: #18181b;
      --surface2: #1f1f23;
      --border: #2a2a30;
      --accent: #6ee7b7;
      --accent-dim: #2d6e58;
      --accent-glow: rgba(110, 231, 183, 0.12);
      --text: #f0f0f2;
      --text-muted: #6b6b75;
      --text-dim: #9999a8;
      --danger: #f87171;
      --warn: #fbbf24;
      --radius: 16px;
      --radius-sm: 10px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      overflow: hidden;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ── Header ── */
    header {
      padding: 56px 24px 16px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .wordmark {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text);
      line-height: 1;
    }

    .wordmark span {
      color: var(--accent);
    }

    .header-meta {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      text-align: right;
      line-height: 1.6;
    }

    /* ── Filter tabs ── */
    .tabs {
      display: flex;
      gap: 8px;
      padding: 0 24px 16px;
      flex-shrink: 0;
    }

    .tab {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .tab.active {
      background: var(--accent-glow);
      border-color: var(--accent-dim);
      color: var(--accent);
    }

    /* ── List ── */
    .list-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 0 24px;
      -webkit-overflow-scrolling: touch;
    }

    .list-wrap::-webkit-scrollbar { display: none; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 40px;
      opacity: 0.4;
    }

    .empty-label {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      opacity: 0.5;
    }

    /* ── Reminder card ── */
    .reminder-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      transition: border-color 0.15s ease, opacity 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .reminder-card.overdue {
      border-color: rgba(248, 113, 113, 0.3);
    }

    .reminder-card.overdue::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--danger);
      border-radius: 3px 0 0 3px;
    }

    .reminder-card.done {
      opacity: 0.4;
    }

    .check-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 12px;
    }

    .check-btn:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
      color: var(--accent);
    }

    .reminder-card.done .check-btn {
      border-color: var(--accent-dim);
      background: var(--accent-glow);
      color: var(--accent);
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 5px;
    }

    .reminder-card.done .card-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .card-time {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-time.overdue-label {
      color: var(--danger);
    }

    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .snooze-btn, .delete-btn {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      padding: 4px 10px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.03em;
    }

    .snooze-btn:hover {
      border-color: var(--accent-dim);
      color: var(--accent);
      background: var(--accent-glow);
    }

    .delete-btn:hover {
      border-color: rgba(248,113,113,0.4);
      color: var(--danger);
      background: rgba(248,113,113,0.08);
    }

    /* ── FAB ── */
    .fab {
      position: absolute;
      bottom: 32px;
      right: 24px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #0f0f10;
      box-shadow: 0 0 0 0 rgba(110, 231, 183, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      z-index: 10;
    }

    .fab:hover {
      transform: scale(1.08);
      box-shadow: 0 0 0 8px rgba(110, 231, 183, 0.15);
    }

    .fab:active {
      transform: scale(0.95);
    }

    /* ── Bottom sheet overlay ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 50;
      display: none;
      align-items: flex-end;
      backdrop-filter: blur(4px);
    }

    .overlay.open {
      display: flex;
    }

    .sheet {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      border-top: 1px solid var(--border);
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 24px 40px;
      animation: slideUp 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .sheet-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text);
    }

    .field-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .field-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.15s ease;
      -webkit-appearance: none;
    }

    .field-input:focus {
      border-color: var(--accent-dim);
    }

    .field-input::placeholder {
      color: var(--text-muted);
    }

    /* datetime input styling */
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(0.6);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-sm);
      background: var(--accent);
      border: none;
      color: #0f0f10;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
      margin-top: 4px;
    }

    .submit-btn:hover { opacity: 0.9; }
    .submit-btn:active { transform: scale(0.98); }

    /* ── Snooze sheet ── */
    .snooze-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .snooze-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface2);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .snooze-option:hover {
      border-color: var(--accent-dim);
      background: var(--accent-glow);
    }

    .snooze-option-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .snooze-option-time {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* custom snooze row */
    .custom-snooze-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .custom-snooze-row .field-input {
      margin-bottom: 0;
      flex: 1;
    }

    .custom-snooze-row .submit-btn {
      width: auto;
      padding: 12px 18px;
      margin-top: 0;
      flex-shrink: 0;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 10px 20px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
      opacity: 0;
      transition: all 0.25s ease;
      white-space: nowrap;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Notif banner ── */
    .notif-bar {
      margin: 0 24px 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(251,191,36,0.3);
      background: rgba(251,191,36,0.07);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--warn);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .notif-bar.hidden { display: none; }

    .notif-bar-enable {
      background: none;
      border: none;
      color: var(--warn);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: underline;
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="wordmark">Pi<span>ng</span></div>
    <div class="header-meta" id="header-meta">0 pending</div>
  </header>

  <div class="notif-bar hidden" id="notif-bar">
    <span>Enable notifications to get pinged</span>
    <button class="notif-bar-enable" onclick="requestNotifPermission()">Enable</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setFilter('pending', this)">Pending</button>
    <button class="tab" onclick="setFilter('all', this)">All</button>
    <button class="tab" onclick="setFilter('done', this)">Done</button>
  </div>

  <div class="list-wrap" id="list-wrap">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">🔔</div>
      <div class="empty-label">nothing pending</div>
    </div>
  </div>

  <button class="fab" onclick="openAdd()" aria-label="Add reminder">+</button>
</div>

<!-- Add sheet -->
<div class="overlay" id="add-overlay" onclick="overlayClick(event, 'add-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">New reminder</div>
    <div class="field-label">What do you need to do?</div>
    <input class="field-input" id="add-title" type="text" placeholder="e.g. Submit PTO request" maxlength="120" />
    <div class="field-label">When?</div>
    <input class="field-input" id="add-time" type="datetime-local" />
    <button class="submit-btn" onclick="addReminder()">Add to Ping</button>
  </div>
</div>

<!-- Snooze sheet -->
<div class="overlay" id="snooze-overlay" onclick="overlayClick(event, 'snooze-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Snooze until…</div>
    <div class="snooze-options" id="snooze-options"></div>
    <div class="field-label">Custom time</div>
    <div class="custom-snooze-row">
      <input class="field-input" id="custom-snooze-time" type="datetime-local" />
      <button class="submit-btn" onclick="applyCustomSnooze()">Set</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ── Storage ──
  const STORAGE_KEY = 'ping_reminders';

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function save(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // ── State ──
  let reminders = load();
  let currentFilter = 'pending';
  let snoozeTargetId = null;

  // ── Helpers ──
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  function formatTime(iso) {
    if (!iso) return 'No time set';
    const d = new Date(iso);
    const now = new Date();
    const isToday = d.toDateString() === now.toDateString();
    const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
    const isTomorrow = d.toDateString() === tomorrow.toDateString();
    const timeStr = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    if (isToday) return `Today ${timeStr}`;
    if (isTomorrow) return `Tomorrow ${timeStr}`;
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + timeStr;
  }

  function isOverdue(r) {
    if (!r.time || r.done) return false;
    return new Date(r.time) < new Date();
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  function pendingCount() {
    return reminders.filter(r => !r.done).length;
  }

  // ── Snooze presets ──
  function getSnoozePresets() {
    const now = new Date();

    // Tonight 9:30pm
    const tonight = new Date(now);
    tonight.setHours(21, 30, 0, 0);
    if (tonight <= now) tonight.setDate(tonight.getDate() + 1);

    // Tomorrow 8am
    const tomorrow = new Date(now);
    tomorrow.setDate(now.getDate() + 1);
    tomorrow.setHours(8, 0, 0, 0);

    // In 1 hour
    const oneHour = new Date(now.getTime() + 60 * 60 * 1000);

    // This weekend — next Saturday 3pm
    const weekend = new Date(now);
    const day = now.getDay(); // 0=Sun
    const daysUntilSat = day === 6 ? 7 : (6 - day);
    weekend.setDate(now.getDate() + daysUntilSat);
    weekend.setHours(15, 0, 0, 0);

    return [
      { label: 'In 1 hour', time: oneHour, display: formatTime(oneHour.toISOString()) },
      { label: 'Tonight', time: tonight, display: formatTime(tonight.toISOString()) },
      { label: 'Tomorrow morning', time: tomorrow, display: formatTime(tomorrow.toISOString()) },
      { label: 'This weekend', time: weekend, display: formatTime(weekend.toISOString()) },
    ];
  }

  // ── Render ──
  function render() {
    const wrap = document.getElementById('list-wrap');
    const empty = document.getElementById('empty-state');
    const meta = document.getElementById('header-meta');

    const count = pendingCount();
    meta.textContent = count === 0 ? 'all clear' : `${count} pending`;

    let filtered = [...reminders].sort((a, b) => {
      if (!a.time) return 1;
      if (!b.time) return -1;
      return new Date(a.time) - new Date(b.time);
    });

    if (currentFilter === 'pending') filtered = filtered.filter(r => !r.done);
    if (currentFilter === 'done') filtered = filtered.filter(r => r.done);

    // clear existing cards
    wrap.querySelectorAll('.reminder-card').forEach(el => el.remove());
    empty.style.display = filtered.length === 0 ? 'flex' : 'none';

    filtered.forEach(r => {
      const overdue = isOverdue(r);
      const card = document.createElement('div');
      card.className = `reminder-card${overdue ? ' overdue' : ''}${r.done ? ' done' : ''}`;
      card.dataset.id = r.id;

      card.innerHTML = `
        <button class="check-btn" onclick="toggleDone('${r.id}')" aria-label="Complete">✓</button>
        <div class="card-body">
          <div class="card-title">${escHtml(r.title)}</div>
          <div class="card-time ${overdue ? 'overdue-label' : ''}">
            ${overdue ? '⚠ ' : ''}${formatTime(r.time)}
          </div>
          ${!r.done ? `
          <div class="card-actions">
            <button class="snooze-btn" onclick="openSnooze('${r.id}')">Snooze</button>
            <button class="delete-btn" onclick="deleteReminder('${r.id}')">Remove</button>
          </div>` : `
          <div class="card-actions">
            <button class="delete-btn" onclick="deleteReminder('${r.id}')">Remove</button>
          </div>`}
        </div>
      `;
      wrap.appendChild(card);
    });

    updateNotifBar();
    scheduleNotifications();
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Actions ──
  function toggleDone(id) {
    const r = reminders.find(r => r.id === id);
    if (!r) return;
    r.done = !r.done;
    save(reminders);
    render();
    toast(r.done ? 'Marked done ✓' : 'Moved back to pending');
  }

  function deleteReminder(id) {
    reminders = reminders.filter(r => r.id !== id);
    save(reminders);
    render();
    toast('Removed');
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  // ── Add ──
  function openAdd() {
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getMinutes() % 5 + 5);
    document.getElementById('add-time').value = toLocalISO(now);
    document.getElementById('add-title').value = '';
    document.getElementById('add-overlay').classList.add('open');
    setTimeout(() => document.getElementById('add-title').focus(), 300);
  }

  function addReminder() {
    const title = document.getElementById('add-title').value.trim();
    const time = document.getElementById('add-time').value;
    if (!title) { toast('Add a title first'); return; }
    const r = { id: uid(), title, time: time ? new Date(time).toISOString() : null, done: false, created: new Date().toISOString() };
    reminders.push(r);
    save(reminders);
    document.getElementById('add-overlay').classList.remove('open');
    render();
    toast('Reminder added');
  }

  // ── Snooze ──
  function openSnooze(id) {
    snoozeTargetId = id;
    const presets = getSnoozePresets();
    const container = document.getElementById('snooze-options');
    container.innerHTML = '';
    presets.forEach(p => {
      const el = document.createElement('div');
      el.className = 'snooze-option';
      el.innerHTML = `<span class="snooze-option-label">${p.label}</span><span class="snooze-option-time">${p.display}</span>`;
      el.onclick = () => applySnooze(p.time.toISOString());
      container.appendChild(el);
    });
    const now = new Date();
    now.setHours(now.getHours() + 1, 0, 0, 0);
    document.getElementById('custom-snooze-time').value = toLocalISO(now);
    document.getElementById('snooze-overlay').classList.add('open');
  }

  function applySnooze(iso) {
    const r = reminders.find(r => r.id === snoozeTargetId);
    if (!r) return;
    r.time = iso;
    r.done = false;
    save(reminders);
    document.getElementById('snooze-overlay').classList.remove('open');
    render();
    toast('Snoozed until ' + formatTime(iso));
  }

  function applyCustomSnooze() {
    const val = document.getElementById('custom-snooze-time').value;
    if (!val) { toast('Pick a time first'); return; }
    applySnooze(new Date(val).toISOString());
  }

  // ── Overlay ──
  function overlayClick(e, id) {
    if (e.target === document.getElementById(id)) {
      document.getElementById(id).classList.remove('open');
    }
  }

  // ── Notifications ──
  function updateNotifBar() {
    const bar = document.getElementById('notif-bar');
    if (Notification.permission === 'granted') {
      bar.classList.add('hidden');
    } else if (Notification.permission === 'denied') {
      bar.classList.add('hidden');
    } else {
      bar.classList.remove('hidden');
    }
  }

  function requestNotifPermission() {
    Notification.requestPermission().then(p => {
      if (p === 'granted') { toast('Notifications on ✓'); render(); }
      else toast('Notifications blocked');
    });
  }

  let scheduledTimers = [];

  function scheduleNotifications() {
    scheduledTimers.forEach(t => clearTimeout(t));
    scheduledTimers = [];
    if (Notification.permission !== 'granted') return;
    const now = Date.now();
    reminders.filter(r => !r.done && r.time).forEach(r => {
      const ms = new Date(r.time).getTime() - now;
      if (ms > 0 && ms < 24 * 60 * 60 * 1000) {
        const t = setTimeout(() => {
          new Notification('Ping', { body: r.title, icon: '/icon-192.png', tag: r.id });
        }, ms);
        scheduledTimers.push(t);
      }
    });
  }

  // ── Util ──
  function toLocalISO(d) {
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // ── Keyboard ──
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.overlay.open').forEach(o => o.classList.remove('open'));
    }
    if (e.key === 'Enter' && document.getElementById('add-overlay').classList.contains('open')) {
      addReminder();
    }
  });

  // ── Init ──
  render();
  updateNotifBar();

  // Seed demo reminder if empty
  if (reminders.length === 0) {
    const demo = new Date();
    demo.setDate(demo.getDate() + 1);
    demo.setHours(8, 0, 0, 0);
    reminders.push({ id: uid(), title: 'Submit PTO request', time: demo.toISOString(), done: false, created: new Date().toISOString() });
    save(reminders);
    render();
  }
</script>
</body>
</html>
